{% load static %}
<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employee Bench Management{% endblock %}</title>
 
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
 
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
 
<body class="bg-light">
 
<!-- ================= NAVBAR ================= -->
 
<nav class="navbar navbar-dark" style="background:#0b4f8a;">
 
    <div class="container-fluid">
 
        <a class="navbar-brand fw-bold"
           href="{% url 'dashboard' %}">
 
            Employee Bench Management
 
        </a>
 
    </div>
 
</nav>
 
<!-- ================= MAIN LAYOUT ================= -->
 
<div class="container-fluid">
 
    <div class="row">
 
        <!-- Sidebar -->
 
        <div class="col-md-2 p-0">
 
            <div class="bg-primary vh-100">
 
                <h5 class="text-center text-white py-4 border-bottom">
 
                    Navigation
 
                </h5>
 
                <div class="list-group rounded-0">
 
                    <a href="{% url 'dashboard' %}"
                       class="list-group-item list-group-item-action">
 
                        <i class="bi bi-speedometer2"></i>
 
                        Dashboard
 
                    </a>
 
                    <a href="{% url 'employee_list' %}"
                       class="list-group-item list-group-item-action">
 
                        <i class="bi bi-people-fill"></i>
 
                        Employees
 
                    </a>
 
                    <a href="{% url 'upload_excel' %}"
                       class="list-group-item list-group-item-action">
 
                        <i class="bi bi-upload"></i>
 
                        Upload Excel
 
                    </a>
 
                    <a href="/admin/"
                       class="list-group-item list-group-item-action">
 
                        <i class="bi bi-shield-lock-fill"></i>
 
                        Django Admin
 
                    </a>
 
                </div>
 
            </div>
 
        </div>
 
        <!-- Main Content -->
 
        <div class="col-md-10">
 
            <div class="p-4">
 
                {% block content %}
 
                {% endblock %}
 
            </div>
 
        </div>
 
    </div>
 
</div>
 
<!-- Bootstrap JS -->
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
</body>
 
</html>
