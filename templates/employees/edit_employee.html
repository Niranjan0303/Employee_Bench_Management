{% extends "base.html" %}
 
{% block title %}Edit Employee{% endblock %}
 
{% block content %}
 
<div class="container mt-4">
 
    <div class="card shadow">
 
        <div class="card-header bg-warning">
 
            <h4>Edit Employee</h4>
 
        </div>
 
        <div class="card-body">
 
            <form method="POST">
 
                {% csrf_token %}
 
                {{ form.as_p }}
 
                <button type="submit" class="btn btn-warning">
                    Update Employee
                </button>
 
                <a href="/employees/" class="btn btn-secondary">
                    Cancel
                </a>
 
            </form>
 
        </div>
 
    </div>
 
</div>
 
{% endblock %}
